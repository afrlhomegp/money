<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123B33">
<meta name="description" content="Perencana tabungan dan pencatat keuangan pribadi yang bekerja luring.">
<title>Dompet A&amp;A</title>
<!-- PWA: href manifest & ikon diisi saat berjalan dari alamat halaman,
     supaya berkas ini tetap bisa dipindah atau diganti nama. -->
<link rel="manifest" id="mfLink">
<link rel="apple-touch-icon" id="appleIcon">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dompet A&amp;A">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   Satu sumber untuk warna, radius, dan spacing. Mode gelap hanya
   menimpa warna — tidak ada satu pun ukuran yang berubah, supaya
   tata letaknya persis sama di kedua mode.
   ============================================================ */
:root{
  color-scheme:light;

  --bg:#EEF1EE;
  --surface:#FFFFFF;
  --surface-alt:#F7F9F7;
  --ink:#111C19;
  --ink-2:#4C5A55;
  --ink-3:#6F7D77;
  --line:#DCE3DE;
  --line-strong:#C6D0CA;

  --pine:#123B33;          /* isian utama: tombol, bar, chart */
  --btn-ink:#FFFFFF;       /* teks di atas --pine dan --pos */
  --pine-2:#0C2A24;
  --pine-soft:#E2EBE7;
  --gold:#E3A93C;
  --gold-soft:#FBF0DA;
  --gold-ink:#8A6210;

  --pos:#2E7D5B;
  --neg:#B8544A;
  --warn:#B5822A;

  --tint-pos:#E4F2EA;      /* latar lembut untuk tanda positif */
  --tint-neg:#FBEAE7;      /* latar lembut untuk tanda negatif */

  --hero-a:#164A40;
  --hero-b:#123B33;
  --hero-c:#0C2A24;
  --hero-ink:#F2F7F4;

  --r-xs:8px;
  --r-sm:10px;
  --r-field:12px;
  --r-md:14px;
  --r-card:16px;
  --r-hero:22px;
  --r-pill:999px;

  --pad:16px;
  --tap:44px;              /* target sentuh minimum */
  --shadow-hero:0 18px 40px -24px rgba(9,42,35,.75);

  --ff:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}

:root[data-theme="dark"]{
  color-scheme:dark;

  --bg:#0E1513;
  --surface:#16221F;
  --surface-alt:#1D2C28;
  --ink:#E9F1ED;
  --ink-2:#AEBFB9;
  --ink-3:#87968F;
  --line:#26332F;
  --line-strong:#3A4C46;

  --pine:#6FCFAE;
  --btn-ink:#07201A;
  --pine-2:#0A1815;
  --pine-soft:#22403A;
  --gold:#E9B84A;
  --gold-soft:#39301A;
  --gold-ink:#E9B84A;

  --pos:#5FD39B;
  --neg:#F08C7E;
  --warn:#E0AE55;

  --tint-pos:#1B3A2C;
  --tint-neg:#3A211D;

  --hero-a:#1B4E43;
  --hero-b:#123B33;
  --hero-c:#0B211C;
  --hero-ink:#EAF3EF;

  --shadow-hero:0 18px 40px -24px rgba(0,0,0,.85);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}

.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{
  position:absolute;left:-9999px;top:8px;z-index:100;
  background:var(--pine);color:var(--btn-ink);padding:11px 16px;border-radius:var(--r-field);
  font-size:14px;font-weight:700;
}
.skip:focus{left:8px}

/* ============================================================
   SHELL
   ============================================================ */
.shell{display:flex;min-height:100vh;min-height:100dvh}

.sidebar{display:none}

.main{
  flex:1;
  min-width:0;
  padding:20px var(--pad) 108px;
}
.wrap{max-width:760px;margin:0 auto}

/* ============================================================
   TAB BAR (mobile)
   ============================================================ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--surface);
  background:var(--surface);
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--ink-3);border-radius:10px;
  font-size:10px;font-weight:600;letter-spacing:.01em;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button[aria-current="page"]{color:var(--pine)}

/* ============================================================
   HEADINGS & TEXT
   ============================================================ */
.greet{margin:4px 0 2px;font-size:26px;font-weight:800;letter-spacing:-.03em}
.greet-sub{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.page-title{margin:2px 0 4px;font-size:22px;font-weight:800;letter-spacing:-.025em}
.page-sub{margin:0 0 16px;color:var(--ink-2);font-size:13.5px}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:26px 0 10px;
}
.section-head h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.section-head .link{font-size:13px;font-weight:600;color:var(--pine);text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--ink-3)}
.note{font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:8px 0 0}

/* ============================================================
   HERO — kartu tabungan
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--hero-a) 0%,var(--hero-b) 46%,var(--hero-c) 100%);
  color:var(--hero-ink);
  border-radius:var(--r-hero);
  padding:22px 20px 20px;
  box-shadow:var(--shadow-hero);
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;
  border-radius:50%;border:1px solid rgba(227,169,60,.28);
}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.hero-label{margin:0;font-size:12.5px;font-weight:600;color:rgba(242,247,244,.72)}
.hero-amount{
  position:relative;margin:8px 0 0;font-weight:800;line-height:1.05;
  font-size:clamp(29px,8.6vw,42px);letter-spacing:-.035em;
  overflow-wrap:anywhere;
}
.status{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  border-radius:var(--r-pill);padding:6px 11px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
  background:rgba(242,247,244,.14);color:#F2F7F4;
}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.status--ok{background:rgba(120,214,168,.18);color:#9FE7C1}
.status--warn{background:rgba(227,169,60,.2);color:#F0C87A}
.status--risk{background:rgba(238,140,128,.2);color:#F5B0A6}

.hero-bar{margin-top:18px;height:7px;border-radius:var(--r-pill);background:rgba(242,247,244,.16);overflow:hidden}
.hero-bar span{display:block;height:100%;border-radius:var(--r-pill);background:var(--gold);width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}
.hero-meta{position:relative;display:flex;justify-content:space-between;gap:14px;margin-top:12px;font-size:12.5px;color:rgba(242,247,244,.75)}
.hero-meta b{display:block;color:#F2F7F4;font-size:14px;font-weight:700;margin-top:2px}
.hero-meta div{min-width:0}
.hero-meta div:nth-child(2){text-align:center}
.hero-meta div:last-child{text-align:right}

/* ============================================================
   QUICK ACTIONS
   ============================================================ */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.quick button{
  display:flex;flex-direction:column;align-items:flex-start;gap:9px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-md);padding:12px 11px;text-align:left;
  font-size:12.5px;font-weight:700;line-height:1.25;color:var(--ink);
  transition:border-color .15s,transform .15s;
}
.quick button:active{transform:scale(.97)}
.quick button:hover{border-color:var(--line-strong)}
.quick .qi{
  width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:16px;font-weight:800;line-height:1;
}
.qi--out{background:var(--tint-neg);color:var(--neg)}
.qi--in{background:var(--tint-pos);color:var(--pos)}
.qi--save{background:var(--gold-soft);color:var(--gold-ink)}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-card);padding:16px;
}
.card + .card{margin-top:10px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.stat{background:var(--surface);padding:14px 14px 13px}
.stat .k{margin:0;font-size:12px;font-weight:600;color:var(--ink-3)}
.stat .v{margin:5px 0 0;font-size:17px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.v--pos{color:var(--pos)}
.v--neg{color:var(--neg)}

/* target card */
.target-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.target-row h3{margin:0;font-size:15px;font-weight:700}
.target-row .pct{font-size:15px;font-weight:800;color:var(--pine)}
.bar{height:9px;border-radius:var(--r-pill);background:var(--pine-soft);overflow:hidden;margin:12px 0 12px}
.bar span{display:block;height:100%;border-radius:var(--r-pill);background:var(--pine);width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}
.bar--gold span{background:var(--gold)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:13.5px;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv dt{margin:0;color:var(--ink-2)}
.kv dd{margin:0;font-weight:700;text-align:right}

/* safe to spend */
.safe{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:16px;border-left:4px solid var(--gold);
}
.safe h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.safe .big{margin:5px 0 0;font-size:clamp(24px,6.6vw,30px);font-weight:800;letter-spacing:-.03em}

/* ============================================================
   ONBOARDING (empty state)
   ============================================================ */
.onb{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 16px}
.onb h2{margin:0 0 3px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.onb p{margin:0 0 16px;font-size:13.5px;color:var(--ink-2)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{
  display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);
}
.steps li:first-child{border-top:0;padding-top:0}
.steps .n{
  flex:0 0 auto;width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:800;
  background:var(--pine-soft);color:var(--pine);
}
.steps li[data-done="1"] .n{background:var(--pos);color:var(--btn-ink)}
.steps .t{flex:1;min-width:0}
.steps .t b{display:block;font-size:14px;font-weight:700}
.steps .t span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:1px}
.steps .go{
  flex:0 0 auto;align-self:center;font-size:12.5px;font-weight:700;color:var(--pine);
  border:1px solid var(--line-strong);border-radius:var(--r-pill);padding:6px 12px;
}
.steps li[data-done="1"] .go{visibility:hidden}

/* ============================================================
   TRANSACTION LIST
   ============================================================ */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-pill);padding:9px 14px;min-height:38px;font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--btn-ink)}

.daygroup{margin-bottom:14px}
.dayhead{display:flex;justify-content:space-between;gap:12px;font-size:12px;font-weight:600;color:var(--ink-3);padding:0 2px 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 14px;border-top:1px solid var(--line);background:var(--surface);
}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-alt)}
.avatar{
  flex:0 0 auto;width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
  font-size:13px;font-weight:800;background:var(--pine-soft);color:var(--pine);
}
.row .body{flex:1;min-width:0}
.row .body b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .body span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{flex:0 0 auto;font-size:14px;font-weight:700;white-space:nowrap}

.empty{
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-card);
  padding:28px 20px;text-align:center;
}
.empty b{display:block;font-size:15px;font-weight:700;margin-bottom:4px}
.empty p{margin:0 0 14px;font-size:13px;color:var(--ink-3)}

/* ============================================================
   BUDGET / ANALITIK
   ============================================================ */
.bud{padding:14px;border-top:1px solid var(--line);background:var(--surface)}
.bud:first-child{border-top:0}
.bud-bar{height:6px;border-radius:var(--r-pill);background:var(--surface-alt);border:1px solid var(--line);overflow:hidden;margin-top:9px}
.bud-bar span{display:block;height:100%;background:var(--pos);width:0}
.bud-bar[data-state="warn"] span{background:var(--gold)}
.bud-bar[data-state="over"] span{background:var(--neg)}
.brk{padding:11px 14px;border-top:1px solid var(--line)}
.brk:first-child{border-top:0}
.brk-top{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.brk-top b{font-weight:600}
.brk-top span{font-weight:700;font-variant-numeric:tabular-nums}
.brk-bar{height:5px;border-radius:var(--r-pill);background:var(--surface-alt);margin-top:7px;overflow:hidden}
.brk-bar span{display:block;height:100%;background:var(--pine);width:0}

/* ============================================================
   FORM / SETTINGS
   ============================================================ */
.field{margin-bottom:14px}
.field > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.input,select.input{
  width:100%;border:1px solid var(--line);border-radius:var(--r-field);
  padding:12px 13px;font-size:15px;background:var(--surface-alt);
}
.input:focus{background:var(--surface);border-color:var(--pine);outline:none}
.input.money{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.money-wrap{position:relative}
.money-wrap .rp{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:600;color:var(--ink-3);pointer-events:none}
.money-wrap .input{padding-left:38px}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--r-field);padding:4px}
.seg button{padding:9px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--btn-ink)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-field);padding:13px 18px;font-size:15px;font-weight:700;
  background:var(--pine);color:var(--btn-ink);width:100%;
  transition:opacity .15s,transform .12s;
}
.btn:active{transform:scale(.99)}
.btn:hover{opacity:.92}
.btn--ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-strong)}
.btn--danger{background:var(--neg);color:var(--btn-ink)}
.btn--sm{width:auto;padding:11px 16px;min-height:40px;font-size:13px;border-radius:var(--r-pill)}
.btn-row{display:flex;gap:9px;margin-top:4px}
.btn-row .btn{flex:1}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;background:var(--surface)}
.set-row:first-child{border-top:0}
.set-row .k{font-size:14px;font-weight:600}
.set-row .k small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);margin-top:1px}
.set-row .v{font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* ============================================================
   QUICK INPUT (Tahap 2)
   ============================================================ */
.amount-field{
  background:var(--surface-alt);border:1px solid var(--line);
  border-radius:var(--r-md);padding:13px 15px 14px;margin-bottom:14px;
}
.amount-field:focus-within{border-color:var(--pine);background:var(--surface)}
.amount-field > label{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:3px}
.amount-row{display:flex;align-items:baseline;gap:8px}
.amount-row .rp{flex:0 0 auto;font-size:19px;font-weight:700;color:var(--ink-3)}
.amount-row input{
  flex:1;min-width:0;border:0;background:transparent;padding:0;
  font-size:clamp(28px,8vw,34px);font-weight:800;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;outline:none;
}
.amount-row input::placeholder{color:var(--line-strong)}

.repeat{display:flex;gap:7px;overflow-x:auto;margin:-4px 0 16px;padding-bottom:3px;scrollbar-width:none}
.repeat::-webkit-scrollbar{display:none}
.repeat button{
  flex:0 0 auto;border:1px dashed var(--line-strong);border-radius:var(--r-pill);
  padding:10px 14px;min-height:40px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);
}
.repeat button:hover{border-style:solid;border-color:var(--pine);color:var(--pine)}

.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.catgrid button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px;border:1px solid var(--line);border-radius:var(--r-field);background:var(--surface);
  font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.2;text-align:center;
}
.catgrid button em{font-style:normal;font-size:18px;line-height:1}
.catgrid button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--btn-ink)}

.datequick{display:flex;gap:7px;flex-wrap:wrap}
.datequick button{
  border:1px solid var(--line);border-radius:var(--r-pill);padding:10px 15px;min-height:40px;
  font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface);
}
.datequick button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--btn-ink)}

/* ============================================================
   SEARCH & FILTER (Tahap 2)
   ============================================================ */
.search{position:relative;margin-bottom:10px}
.search input{
  width:100%;border:1px solid var(--line);border-radius:var(--r-pill);
  padding:11px 42px;font-size:14px;background:var(--surface);
}
.search input:focus{border-color:var(--pine);outline:none}
.search .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3);display:grid;place-items:center;pointer-events:none}
.search .si svg{width:16px;height:16px}
.search .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;background:var(--surface-alt);
  color:var(--ink-2);font-size:15px;line-height:1;display:grid;place-items:center;
}

.filterbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.filterbar .chips{margin:0;flex:1;min-width:0}
.fbtn{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);
  padding:9px 13px;min-height:38px;font-size:12.5px;font-weight:600;color:var(--ink-2);
}
.fbtn svg{width:15px;height:15px}
.fbtn[data-on="1"]{background:var(--pine-soft);border-color:var(--pine);color:var(--pine)}
.fbtn b{background:var(--pine);color:var(--btn-ink);border-radius:var(--r-pill);min-width:17px;height:17px;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center;padding:0 4px}

.activef{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.activef button{
  display:inline-flex;align-items:center;gap:7px;background:var(--pine-soft);color:var(--pine);
  border-radius:var(--r-pill);padding:5px 9px 5px 11px;font-size:12px;font-weight:600;
}
.activef button i{font-style:normal;font-size:14px;line-height:1;opacity:.7}

/* ringkasan transaksi */
.txsum .k{margin:0;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.txsum .big{margin:4px 0 0;font-size:clamp(25px,7vw,31px);font-weight:800;letter-spacing:-.03em}
.txsum-split{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);margin:15px -16px -16px;border-radius:0 0 15px 15px;overflow:hidden}
.txsum-split div{background:var(--surface);padding:12px 16px}
.txsum-split span{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.txsum-split b{display:block;font-size:15px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}

.periodnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.periodnav .lbl{
  flex:1;text-align:center;font-size:14px;font-weight:700;
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:8px 12px;
}
.periodnav .arrow{
  flex:0 0 auto;width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font-size:17px;line-height:1;display:grid;place-items:center;
}
.periodnav .arrow[disabled]{opacity:.35;cursor:default}

/* baris transaksi */
.avatar em{font-style:normal;font-size:16px;line-height:1}
.avatar--in{background:var(--tint-pos)}
.avatar--out{background:var(--tint-neg)}
.avatar--save{background:var(--gold-soft)}
.row .right{flex:0 0 auto;text-align:right}
.row .right b{display:block;font-size:14px;font-weight:700;white-space:nowrap}
.row .right span{display:block;font-size:11px;color:var(--ink-3);margin-top:1px;white-space:nowrap}

/* ============================================================
   BUDGET & ANALITIK (Tahap 3)
   ============================================================ */
.bstat{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);padding:5px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.bstat i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.bstat--ok{background:var(--tint-pos);color:var(--pos)}
.bstat--near{background:var(--gold-soft);color:var(--gold-ink)}
.bstat--over{background:var(--tint-neg);color:var(--neg)}
.bstat--none{background:var(--surface-alt);color:var(--ink-3)}

.usage{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.usage .pctbig{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.035em;line-height:1}
.usage .pctbig small{font-size:15px;font-weight:700;margin-left:2px}

.bcat{display:block;width:100%;text-align:left;padding:14px;border-top:1px solid var(--line);background:var(--surface)}
.bcat:first-child{border-top:0}
.bcat:hover{background:var(--surface-alt)}
.bcat-top{display:flex;align-items:center;gap:10px}
.bcat-top em{font-style:normal;font-size:17px;line-height:1;flex:0 0 auto}
.bcat-top b{flex:1;min-width:0;font-size:14px;font-weight:600}
.bcat-foot{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.bcat-foot span{font-variant-numeric:tabular-nums}
.bcat-foot .over{color:var(--neg);font-weight:700}

/* batang horizontal untuk perbandingan */
.hbar + .hbar{margin-top:13px}
.hbar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;margin-bottom:6px}
.hbar-top span{color:var(--ink-2);font-weight:600}
.hbar-top b{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hbar-track{height:11px;border-radius:var(--r-pill);background:var(--surface-alt);border:1px solid var(--line);overflow:hidden}
.hbar-track span{display:block;height:100%;border-radius:var(--r-pill);width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}

/* chart SVG */
.chart{display:block;width:100%;height:auto}
.chart-note{font-size:12px;color:var(--ink-3);margin:10px 0 0;line-height:1.5}

/* insight */
.insight{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-top:1px solid var(--line);background:var(--surface)}
.insight:first-child{border-top:0}
.insight i{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:6px;display:block}
.insight p{margin:0;font-size:13.5px;line-height:1.5}

/* review bulanan */
.review dt{color:var(--ink-2)}
.verdict{margin:14px -16px -16px;padding:14px 16px;background:var(--surface-alt);border-top:1px solid var(--line);border-radius:0 0 15px 15px;font-size:13.5px;line-height:1.55;font-weight:600}

/* preset budget */
.presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:-4px;margin-bottom:16px}
.presets button{border:1px dashed var(--line-strong);border-radius:var(--r-pill);padding:10px 14px;min-height:40px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
.presets button:hover{border-style:solid;border-color:var(--pine);color:var(--pine)}

/* ============================================================
   GOAL PLANNING & FINANCIAL HEALTH (Tahap 4)
   ============================================================ */
.reason{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.reason strong{color:var(--ink);font-weight:700}

/* simulator */
.range{
  width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:var(--r-pill);
  background:var(--pine-soft);outline:none;margin:16px 0 7px;
}
.range::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:25px;height:25px;border-radius:50%;
  background:var(--pine);border:3px solid var(--surface);box-shadow:0 2px 7px rgba(9,42,35,.35);cursor:pointer;
}
.range::-moz-range-thumb{
  width:21px;height:21px;border-radius:50%;background:var(--pine);
  border:3px solid var(--surface);box-shadow:0 2px 7px rgba(9,42,35,.35);cursor:pointer;
}
.range:focus-visible{outline:2px solid var(--pine);outline-offset:4px}
.range-ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);font-weight:600}
.simval{font-size:clamp(24px,7vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.simout{margin-top:16px;padding:14px;background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--r-field)}
.simout b{display:block;font-size:clamp(19px,5.2vw,23px);font-weight:800;letter-spacing:-.025em;margin-bottom:5px}
.simout p{margin:0;font-size:13px;line-height:1.55;color:var(--ink-2)}

/* rencana aksi */
.plan{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-top:1px solid var(--line);background:var(--surface)}
.plan:first-child{border-top:0}
.plan em{
  flex:0 0 auto;font-style:normal;width:23px;height:23px;border-radius:var(--r-xs);
  background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-size:11.5px;font-weight:800;
}
.plan p{margin:0;font-size:13.5px;line-height:1.5}

/* financial health */
.score-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.score-num{font-size:clamp(40px,12vw,50px);font-weight:800;letter-spacing:-.045em;line-height:1}
.score-num small{font-size:16px;font-weight:700;color:var(--ink-3);letter-spacing:0}
.hs{padding:13px 0;border-top:1px solid var(--line)}
.hs-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;margin-bottom:7px}
.hs-top b{font-weight:600}
.hs-top span{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.hs-bar{height:5px;border-radius:var(--r-pill);background:var(--surface-alt);overflow:hidden}
.hs-bar span{display:block;height:100%;border-radius:var(--r-pill);background:var(--pine);width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}
.hs p{margin:7px 0 0;font-size:12px;color:var(--ink-3);line-height:1.5}

/* ============================================================
   PWA & NOTIFIKASI (Tahap 5)
   Memakai token warna yang sama dengan bagian lain — tidak ada
   warna baru, supaya mode gelap ikut benar tanpa aturan tambahan.
   ============================================================ */
.bell{
  position:fixed;z-index:45;
  top:calc(12px + env(safe-area-inset-top));
  right:calc(12px + env(safe-area-inset-right));
  width:42px;height:42px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface);
  background:color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  color:var(--ink-2);
  box-shadow:0 8px 20px -14px rgba(9,42,35,.7);
}
.bell svg{width:20px;height:20px}
.bell:hover{color:var(--pine);border-color:var(--line-strong)}
.bell .dot{
  position:absolute;top:-3px;right:-3px;
  min-width:19px;height:19px;padding:0 5px;border-radius:var(--r-pill);
  background:var(--neg);color:#fff;
  font-size:10.5px;font-weight:800;line-height:19px;text-align:center;
  border:2px solid var(--bg);
  font-variant-numeric:tabular-nums;
}
.bell[data-unread="0"] .dot{display:none}

/* daftar notifikasi */
.nlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.nitem{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 14px;border-top:1px solid var(--line);background:var(--surface);
}
.nitem:first-child{border-top:0}
.nitem:hover{background:var(--surface-alt)}
.nitem .ni{flex:0 0 auto;width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:15px;line-height:1}
.nitem .nb{flex:1;min-width:0}
.nitem .nt{display:block;font-size:13.8px;font-weight:700;letter-spacing:-.01em}
.nitem .nm{display:block;font-size:12.8px;line-height:1.5;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.nitem .nd{display:block;font-size:11.5px;color:var(--ink-3);margin-top:6px}
.nitem[data-read="0"]{background:var(--surface-alt)}
.nitem[data-read="0"] .nt::after{
  content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--pine);margin-left:7px;vertical-align:middle;
}
.ni--INFO{background:var(--pine-soft);color:var(--pine)}
.ni--WARNING{background:var(--gold-soft);color:var(--gold-ink)}
.ni--CRITICAL{background:var(--tint-neg);color:var(--neg)}
.ni--SUCCESS{background:var(--tint-pos);color:var(--pos)}

/* sakelar */
.swch{
  position:relative;flex:0 0 auto;display:block;
  width:46px;height:27px;border-radius:var(--r-pill);
  background:var(--line-strong);transition:background .18s;
}
.swch::after{
  content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s;
}
.swch[data-on="1"]{background:var(--pine)}
.swch[data-on="1"]::after{transform:translateX(19px)}
.set-row[data-off="1"]{opacity:.5}
.set-row[data-off="1"] .swch{background:var(--line)}

/* indikator jaringan */
#netBar{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(128px + env(safe-area-inset-bottom));
  z-index:50;display:none;
  background:var(--pine-2);color:var(--hero-ink);
  padding:9px 16px;border-radius:var(--r-pill);
  font-size:12.5px;font-weight:600;text-align:center;max-width:88vw;
  box-shadow:0 10px 26px -14px rgba(9,42,35,.85);
}
body[data-net="off"] #netBar{display:block}

/* jarak aman saat berjalan sebagai aplikasi terpasang */
body[data-standalone="1"] .main{padding-top:calc(22px + env(safe-area-inset-top))}

/* ============================================================
   SHEET (modal)
   ============================================================ */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(11,29,25,.42);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet{
  width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;
  background:var(--surface);border-radius:var(--r-hero) var(--r-hero) 0 0;
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));
  animation:rise .22s cubic-bezier(.22,1,.36,1);
}
.grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--line-strong);margin:6px auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sheet-head .x{width:38px;height:38px;border-radius:50%;background:var(--surface-alt);color:var(--ink-2);font-size:17px;line-height:1;display:grid;place-items:center}

.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:80;background:var(--pine-2);color:var(--hero-ink);
  padding:11px 17px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;
  box-shadow:0 10px 26px -12px rgba(9,42,35,.8);
  animation:rise .2s ease;max-width:88vw;text-align:center;
}

/* ============================================================
   DESKTOP
   ============================================================ */
@media (min-width:900px){
  body{font-size:15.5px}
  .tabbar{display:none}
  .sidebar{
    display:flex;flex-direction:column;flex:0 0 250px;
    background:var(--surface);border-right:1px solid var(--line);
    padding:26px 16px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .brand .mark{width:34px;height:34px;border-radius:var(--r-sm);background:var(--pine);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:12.5px;letter-spacing:-.02em}
  .brand b{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .brand small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
  .snav{display:flex;flex-direction:column;gap:2px}
  .snav button{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;
    font-size:14px;font-weight:600;color:var(--ink-2);width:100%;text-align:left;
  }
  .snav button svg{width:19px;height:19px;flex:0 0 auto}
  .snav button:hover{background:var(--surface-alt)}
  .snav button[aria-current="page"]{background:var(--pine-soft);color:var(--pine);font-weight:700}
  .side-foot{margin-top:auto;padding:12px 12px 0;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}

  .main{padding:34px 34px 60px}
  .greet{font-size:30px}
  .hero{padding:26px 26px 24px}
  .quick{gap:12px}
  .quick button{flex-direction:row;align-items:center;gap:12px;padding:14px 16px;font-size:13.5px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .catgrid{grid-template-columns:repeat(4,1fr)}
  .amount-row input{font-size:36px}
  .backdrop{align-items:center}
  .sheet{border-radius:var(--r-hero);padding:8px 24px 26px;max-height:86vh}
  .grab{display:none}
  .sheet-head{margin-top:14px}
  .toast{bottom:32px}
}

@media (min-width:900px){
  .bell{top:22px;right:26px;width:44px;height:44px}
  #netBar{bottom:28px}
  body[data-standalone="1"] .main{padding-top:calc(34px + env(safe-area-inset-top))}
  body[data-standalone="1"] .sidebar{padding-top:calc(26px + env(safe-area-inset-top))}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

<body>

<a class="skip" href="#view">Lewati ke konten utama</a>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">A&amp;A</div>
      <div><b>Dompet A&amp;A</b><small>Perencana tabungan</small></div>
    </div>
    <nav class="snav" id="snav" aria-label="Navigasi utama"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <div class="wrap" id="view" tabindex="-1"></div>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Navigasi utama"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<button class="bell" id="bellBtn" data-action="notif-center" data-unread="0" aria-label="Notifikasi">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.3 9.9a5.7 5.7 0 0 1 11.4 0c0 3.2.7 5 1.5 6.1H4.8c.8-1.1 1.5-2.9 1.5-6.1Z"/><path d="M9.7 19.1a2.5 2.5 0 0 0 4.6 0"/></svg>
  <span class="dot" aria-hidden="true">0</span>
</button>
<div id="netBar" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ==========================================================================
   DOMPET 50JT — Tahap 1: foundation & core system
   Arsitektur: Store (data) → Calc (rumus) → Views (render) → Router
   ========================================================================== */

/* ---------------------------------------------------------------- CONFIG */
const APP_DATA_VERSION = 3;
const STORAGE_KEY = "dompet50jt:data";

/* --- Tahap 5: PWA & notifikasi. Konstanta ditaruh di sini supaya sudah siap
       sebelum Store.defaults() dipanggil saat boot. --- */
const NOTIF_KEY = "dompet50jt:notif";          // riwayat notifikasi — kunci TERPISAH
const NOTIF_STATE_VERSION = 1;                 // dari data keuangan, supaya berkas
const NOTIF_HISTORY_MAX = 60;                  // ekspor tetap seperti dulu
const APP_NAME = "Dompet A&A";   // nama tampilan; kunci penyimpanan TIDAK ikut berubah
const SW_URL = "sw.js";
const IDB_NAME = "dompet50jt";
const IDB_STORE = "pwa";
const HOUR = 3600000, DAY = 86400000;

const $  = (s,r)=> (r||document).querySelector(s);
const pad2 = n => String(n).padStart(2,"0");

/** Selalu kembalikan angka valid — tidak pernah NaN/Infinity. */
function num(v){ const n = typeof v==="number" ? v : parseFloat(v); return Number.isFinite(n) ? n : 0; }
/** Pembagian aman: penyebut 0 → fallback. */
function div(a,b,fallback){ a=num(a); b=num(b); return b===0 ? num(fallback) : a/b; }
const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, num(v)));

function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function monthKeyOf(iso){ return String(iso||"").slice(0,7); }
function currentMonthKey(){ return todayISO().slice(0,7); }
function daysInMonth(key){ const [y,m]=key.split("-").map(Number); return new Date(y,m,0).getDate(); }
function parseISO(iso){ const d=new Date(String(iso)+"T00:00:00"); return isNaN(d.getTime()) ? null : d; }
function isoOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function shiftDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return isoOf(d); }
function shiftMonth(key,n){ const [y,m]=String(key).split("-").map(Number); const d=new Date(y,(m-1)+n,1); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }

/** Kelompok tampilan: Hari ini → Kemarin → Minggu ini → Minggu lalu → per bulan. */
function bucketOf(iso){
  const today = todayISO();
  if(iso === today)        return {label:"Hari ini"};
  if(iso === shiftDays(-1)) return {label:"Kemarin"};

  const now = parseISO(today);
  const d = parseISO(iso);
  if(!d || !now) return {label:"Lainnya"};
  if(d > now) return {label:"Akan datang"};

  const dow = (now.getDay() + 6) % 7;               // 0 = Senin
  const monday = parseISO(today); monday.setDate(now.getDate() - dow);
  if(d >= monday) return {label:"Minggu ini"};

  const prevMonday = parseISO(today); prevMonday.setDate(now.getDate() - dow - 7);
  if(d >= prevMonday) return {label:"Minggu lalu"};

  return {label: Fmt.monthLabel(monthKeyOf(iso))};
}

/* ---------------------------------------------------------------- FORMAT */
/* Kaidah Indonesia: lambang Rp menempel pada angka, pemisah ribuan titik,
   dan tanda minus di depan lambang — "-Rp5.000", bukan "Rp -5.000". */
const Fmt = {
  rp(v){
    const n = Math.round(num(v));
    return (n < 0 ? "-" : "") + "Rp" + Math.abs(n).toLocaleString("id-ID");
  },
  rpShort(v){
    const n = Math.round(num(v)), a = Math.abs(n), s = n < 0 ? "-" : "";
    if(a >= 1e9) return s+"Rp"+(a/1e9).toFixed(a >= 1e10 ? 0 : 1).replace(".",",")+" M";
    if(a >= 1e6) return s+"Rp"+(a/1e6).toFixed(a >= 1e8 ? 0 : 1).replace(".",",")+" jt";
    if(a >= 1e4) return s+"Rp"+Math.round(a/1e3)+" rb";
    return Fmt.rp(n);
  },
  plain(v){ return Math.round(num(v)).toLocaleString("id-ID"); },
  pct(v){ const n = clamp(v,0,999); return (Math.round(n*10)/10).toString().replace(".",",")+"%"; },
  date(iso){
    const d = parseISO(iso); if(!d) return "—";
    return d.getDate()+" "+MONTHS_SHORT[d.getMonth()]+" "+d.getFullYear();
  },
  dateLong(iso){
    const d = parseISO(iso); if(!d) return "—";
    return d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
  },
  dateShort(iso){
    const d = parseISO(iso); if(!d) return "—";
    const now = new Date();
    return d.getDate()+" "+MONTHS_SHORT[d.getMonth()]+(d.getFullYear()!==now.getFullYear() ? " "+String(d.getFullYear()).slice(2) : "");
  },
  dayHead(iso){
    const d = parseISO(iso); if(!d) return "—";
    const t = todayISO();
    if(iso === t) return "Hari ini";
    const y = new Date(); y.setDate(y.getDate()-1);
    if(iso === y.getFullYear()+"-"+pad2(y.getMonth()+1)+"-"+pad2(y.getDate())) return "Kemarin";
    return DAYS[d.getDay()]+", "+d.getDate()+" "+MONTHS_SHORT[d.getMonth()];
  },
  monthLabel(key){
    const [y,m] = String(key).split("-").map(Number);
    if(!m) return "—";
    return MONTHS[m-1]+" "+y;
  },
  monthShort(key){
    const [,m] = String(key).split("-").map(Number);
    return m ? MONTHS_SHORT[m-1] : "—";
  }
};

/* ---------------------------------------------------------------- TEMA */
const Theme = {
  choice(){
    const t = Store.data && Store.data.settings ? Store.data.settings.theme : "auto";
    return (t === "light" || t === "dark") ? t : "auto";
  },
  prefersDark(){
    try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
    catch(e){ return false; }
  },
  resolved(){
    const c = Theme.choice();
    return c === "auto" ? (Theme.prefersDark() ? "dark" : "light") : c;
  },
  apply(){
    const r = Theme.resolved();
    document.documentElement.setAttribute("data-theme", r);
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", r === "dark" ? "#0E1513" : "#123B33");
  },
  set(c){
    Store.data.settings.theme = (c === "light" || c === "dark") ? c : "auto";
    Store.save();
    Theme.apply();
  },
  watch(){
    try{
      const mq = window.matchMedia("(prefers-color-scheme: dark)");
      const on = () => { if(Theme.choice() === "auto") Theme.apply(); };
      if(mq.addEventListener) mq.addEventListener("change", on);
      else if(mq.addListener) mq.addListener(on);
    } catch(e){ /* lingkungan tanpa matchMedia */ }
  }
};

/* ---------------------------------------------------------------- STORE */
const Store = {
  data:null,
  rev:0,          // naik setiap data berubah — dipakai untuk membatalkan cache

  defaults(){
    const budgets = {};
    EXPENSE_CATS.forEach(c => { budgets[c] = 0; });
    return {
      version: APP_DATA_VERSION,
      profile:{
        name:"",
        savingsBase:0,      // saldo tabungan awal saat mulai memakai aplikasi
        monthlyIncome:0,    // perkiraan pemasukan bulanan (dipakai bila belum ada transaksi)
        targetSavings:50000000,
        targetDate:"",
        createdAt:new Date().toISOString()
      },
      budgets: budgets,
      recurring: [],        // {id,name,amount,category,dayOfMonth}
      transactions: [],     // {id,type,amount,category,date,note,createdAt}
      settings:{ onboardingDismissed:false, theme:"auto", notif: Object.assign({}, NOTIF_DEFAULTS) }
    };
  },

  /** Gabungkan data tersimpan dengan default supaya field baru tidak undefined. */
  migrate(raw){
    const d = Store.defaults();
    if(!raw || typeof raw !== "object") return d;
    const out = d;
    if(raw.profile && typeof raw.profile === "object"){
      Object.keys(d.profile).forEach(k => { if(raw.profile[k] !== undefined) out.profile[k] = raw.profile[k]; });
    }
    if(raw.budgets && typeof raw.budgets === "object"){
      EXPENSE_CATS.forEach(c => { out.budgets[c] = num(raw.budgets[c]); });
    }
    if(Array.isArray(raw.recurring)) out.recurring = raw.recurring.filter(r => r && r.id);
    if(Array.isArray(raw.transactions)){
      out.transactions = raw.transactions
        .filter(t => t && t.id && t.date)
        .map(t => ({
          id:String(t.id),
          type: (t.type==="income"||t.type==="expense"||t.type==="saving") ? t.type : "expense",
          amount: Math.max(0, num(t.amount)),
          category: String(t.category||"Lainnya"),
          date: String(t.date).slice(0,10),
          note: String(t.note||""),
          createdAt: t.createdAt || new Date().toISOString()
        }));
    }
    if(raw.settings && typeof raw.settings === "object"){
      Object.keys(d.settings).forEach(k => { if(raw.settings[k] !== undefined) out.settings[k] = raw.settings[k]; });
    }
    /* Pengaturan notifikasi digabung per-field, bukan ditimpa utuh: berkas
       cadangan lama (tanpa blok notif) atau versi lain tetap terbaca, dan
       field baru selalu punya nilai. Ini migrasi, bukan reset. */
    const rn = (raw.settings && raw.settings.notif && typeof raw.settings.notif === "object") ? raw.settings.notif : {};
    const nf = Object.assign({}, NOTIF_DEFAULTS);
    Object.keys(NOTIF_DEFAULTS).forEach(k => { if(rn[k] !== undefined) nf[k] = rn[k]; });
    ["master","daily","saving","budgetWarn","budgetOver","anomaly","weekly","monthly",
     "goalMilestone","goalRisk","goalDone"].forEach(k => { nf[k] = !!nf[k]; });
    nf.dailyHour = clamp(num(nf.dailyHour), 0, 23);
    if(["never","weekly","monthly"].indexOf(nf.goalFreq) === -1) nf.goalFreq = "weekly";
    out.settings.notif = nf;

    out.version = APP_DATA_VERSION;
    return out;
  },

  load(){
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
    catch(e){ console.warn("Data tersimpan tidak terbaca, memakai data awal.", e); }
    Store.data = Store.migrate(raw);
    Store.rev++;
    return Store.data;
  },

  save(){
    Store.rev++;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data)); }
    catch(e){ console.error("Gagal menyimpan:", e); UI.toast("Penyimpanan browser penuh atau diblokir"); return false; }
    // Notifikasi menumpang di sini, tapi tidak boleh menggagalkan penyimpanan.
    if(_appReady){ try { Notif.onDataChange(); } catch(e){ console.warn("Pemeriksaan notifikasi dilewati:", e); } }
    return true;
  },

  reset(){
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){ /* abaikan */ }
    if(_appReady){ try { Notif.wipe(); } catch(e){ /* abaikan */ } }
    Store.data = Store.defaults();
    Store.rev++;
  },

  /* --- transaksi --- */
  addTx(tx){
    Store.data.transactions.push({
      id: uid(),
      type: tx.type,
      amount: Math.max(0, num(tx.amount)),
      category: tx.category || "Lainnya",
      date: tx.date || todayISO(),
      note: String(tx.note || ""),
      createdAt: new Date().toISOString()
    });
    Store.save();
  },
  updateTx(id, patch){
    const t = Store.data.transactions.find(x => x.id === id);
    if(!t) return;
    if(patch.amount !== undefined) t.amount = Math.max(0, num(patch.amount));
    ["type","category","date","note"].forEach(k => { if(patch[k] !== undefined) t[k] = patch[k]; });
    Store.save();
  },
  removeTx(id){
    Store.data.transactions = Store.data.transactions.filter(t => t.id !== id);
    Store.save();
  },
  setProfile(patch){ Object.assign(Store.data.profile, patch); Store.save(); },
  setBudget(cat, val){ Store.data.budgets[cat] = Math.max(0, num(val)); Store.save(); }
};

/* ---------------------------------------------------------------- CALC */
/* Pengelompokan per bulan dipakai berkali-kali dalam satu render (grafik,
   budget, skor kesehatan). Dihitung sekali per perubahan data, bukan sekali
   per pemanggilan, supaya tetap ringan saat transaksinya sudah ratusan. */
let _monthCache = {rev:-1, map:null};

const Calc = {
  txs(){ return Store.data.transactions; },

  inMonth(key){
    if(_monthCache.rev !== Store.rev){
      const map = {};
      Calc.txs().forEach(t => {
        const k = monthKeyOf(t.date);
        (map[k] = map[k] || []).push(t);
      });
      _monthCache = {rev:Store.rev, map};
    }
    return _monthCache.map[key] || [];
  },

  sum(list, type){
    return list.reduce((a,t) => a + (t.type === type ? num(t.amount) : 0), 0);
  },

  /** Saldo tabungan = saldo awal + semua pemasukan − pengeluaran + setoran tabungan. */
  currentSavings(){
    const p = Store.data.profile;
    const all = Calc.txs();
    return num(p.savingsBase) + Calc.sum(all,"income") - Calc.sum(all,"expense") + Calc.sum(all,"saving");
  },

  /** Arus kas bulan berjalan (rumus: Income − Expense). */
  monthlySaving(key){
    const list = Calc.inMonth(key);
    return Calc.sum(list,"income") - Calc.sum(list,"expense");
  },

  monthKeysWithData(){
    const set = {};
    Calc.txs().forEach(t => { const k = monthKeyOf(t.date); if(k) set[k] = 1; });
    return Object.keys(set).sort();
  },

  /** Rata-rata tabungan per bulan dari data yang ada. null bila belum ada data. */
  avgMonthlySaving(){
    const keys = Calc.monthKeysWithData();
    if(keys.length === 0) return null;
    const total = keys.reduce((a,k) => a + Calc.monthlySaving(k), 0);
    return div(total, keys.length, 0);
  },

  /** Sisa bulan menuju target date. null bila tanggal belum diisi. */
  remainingMonths(){
    const iso = Store.data.profile.targetDate;
    const t = parseISO(iso);
    if(!t) return null;
    const now = new Date();
    const raw = (t.getFullYear()-now.getFullYear())*12 + (t.getMonth()-now.getMonth());
    if(t.getTime() < new Date(todayISO()+"T00:00:00").getTime()) return 0;
    return Math.max(raw, 1);
  },

  gap(){ return Math.max(0, num(Store.data.profile.targetSavings) - Calc.currentSavings()); },

  /** (Target − Tabungan) / Sisa bulan. null bila tanggal target belum diisi. */
  requiredMonthlySaving(){
    const gap = Calc.gap();
    if(gap === 0) return 0;
    const rem = Calc.remainingMonths();
    if(rem === null) return null;
    if(rem <= 0) return gap;             // tanggal target sudah lewat
    return div(gap, rem, gap);
  },

  targetProgress(){
    const target = num(Store.data.profile.targetSavings);
    if(target <= 0) return 0;
    return clamp(div(Calc.currentSavings(), target, 0) * 100, 0, 100);
  },

  savingRate(key){
    const list = Calc.inMonth(key);
    const income = Calc.sum(list,"income") || num(Store.data.profile.monthlyIncome);
    if(income <= 0) return null;
    return div(Calc.monthlySaving(key), income, 0) * 100;
  },

  totalBudget(){
    return EXPENSE_CATS.reduce((a,c) => a + num(Store.data.budgets[c]), 0);
  },

  /** Pengeluaran bulan ini pada kategori yang punya budget. */
  spentInBudgeted(key){
    return Calc.inMonth(key).reduce((a,t) => {
      if(t.type !== "expense") return a;
      return a + (num(Store.data.budgets[t.category]) > 0 ? num(t.amount) : 0);
    }, 0);
  },

  budgetLeft(key){
    const total = Calc.totalBudget();
    if(total <= 0) return null;
    return total - Calc.spentInBudgeted(key);
  },

  /** Status keuangan terhadap target. Satu sumber kebenaran di Goal.status(). */
  status(){ return Goal.status(); },

  /** Estimasi aman dibelanjakan hari ini + komponen penyusunnya. */
  safeToSpend(){
    const key = currentMonthKey();
    const list = Calc.inMonth(key);
    const p = Store.data.profile;

    const incomeM  = Calc.sum(list,"income") || num(p.monthlyIncome);
    const expenseM = Calc.sum(list,"expense");
    const need     = num(Calc.requiredMonthlySaving());
    const dLeft    = Math.max(1, daysInMonth(key) - new Date().getDate() + 1);

    let pool = incomeM - need - expenseM;
    let cappedByBudget = false;
    const bLeft = Calc.budgetLeft(key);
    if(bLeft !== null && bLeft < pool){ pool = bLeft; cappedByBudget = true; }

    return {
      perDay: Math.max(0, div(pool, dLeft, 0)),
      pool: pool, incomeM, expenseM, need, daysLeft: dLeft,
      cappedByBudget,
      hasBasis: incomeM > 0
    };
  },

  /** Perkiraan bulan target tercapai berdasarkan rata-rata tabungan. */
  projection(){
    const gap = Calc.gap();
    if(gap === 0) return {reached:true};
    const avg = Calc.avgMonthlySaving();
    if(avg === null || avg <= 0) return {reached:false, months:null};
    const months = Math.ceil(div(gap, avg, 0));
    const d = new Date();
    d.setDate(1);
    d.setMonth(d.getMonth() + months);
    return {reached:false, months, label: MONTHS[d.getMonth()]+" "+d.getFullYear()};
  }
};

  progressBars(){

View._safeText = function(s){
  if(!s.hasBasis){
    return "Belum ada pemasukan yang tercatat bulan ini. Isi pemasukan bulanan di Pengaturan atau catat satu pemasukan agar angka ini bisa dihitung.";
  }
  let t = "Dari pemasukan "+Fmt.rpShort(s.incomeM)+" bulan ini, dikurangi "+Fmt.rpShort(s.need)+
          " untuk target tabungan dan "+Fmt.rpShort(s.expenseM)+" yang sudah terpakai, tersisa "+
          Fmt.rpShort(Math.max(0,s.pool))+" untuk "+s.daysLeft+" hari ke depan.";
  if(s.cappedByBudget) t += " Angka ini dibatasi oleh sisa budget bulananmu.";
  if(s.pool <= 0) t += " Sisa sudah habis — tahan pengeluaran sampai bulan depan atau sesuaikan target.";
  return t;
};

View._sortTx = function(a,b){
  if(a.date !== b.date) return a.date < b.date ? 1 : -1;
  return String(b.createdAt) < String(a.createdAt) ? -1 : 1;
};

View._txRow = function(t){
  const sign  = t.type === "expense" ? "−" : "+";
  const color = t.type === "expense" ? "var(--neg)" : (t.type === "saving" ? "var(--warn)" : "var(--pos)");
  const av    = t.type === "expense" ? "avatar--out" : (t.type === "saving" ? "avatar--save" : "avatar--in");
  const sub   = t.note ? esc(t.note) : TYPE_LABEL[t.type];
  return '<button class="row" data-action="tx-detail" data-id="'+esc(t.id)+'">'+
      '<span class="avatar '+av+'"><em>'+catIcon(t.category)+'</em></span>'+
      '<span class="body"><b>'+esc(t.category)+'</b><span>'+sub+'</span></span>'+
      '<span class="right"><b class="num" style="color:'+color+'">'+sign+" "+Fmt.plain(t.amount)+'</b>'+
        '<span>'+Fmt.dateShort(t.date)+'</span></span>'+
    '</button>';
};

/* ---------- Transaksi ---------- */
const Tx = {
  q:"", type:"all", cat:"all",
  period:{ mode:"month", key:currentMonthKey(), from:"", to:"" },

  /** Rentang tanggal aktif. null = seluruh waktu. */
  range(){
    const p = Tx.period;
    if(p.mode === "all") return null;
    if(p.mode === "custom") return { from: p.from || "0000-01-01", to: p.to || "9999-12-31" };
    return { from: p.key+"-01", to: p.key+"-"+pad2(daysInMonth(p.key)) };
  },

  periodLabel(){
    const p = Tx.period;
    if(p.mode === "all") return "Seluruh waktu";
    if(p.mode === "custom"){
      if(!p.from && !p.to) return "Rentang khusus";
      return (p.from ? Fmt.date(p.from) : "Awal") + " – " + (p.to ? Fmt.date(p.to) : "Sekarang");
    }
    if(p.key === currentMonthKey()) return "Bulan ini";
    if(p.key === shiftMonth(currentMonthKey(),-1)) return "Bulan lalu";
    return Fmt.monthLabel(p.key);
  },

  /** Transaksi dalam periode aktif, tanpa filter jenis/kategori/pencarian. */
  inPeriod(){
    const r = Tx.range();
    if(!r) return Calc.txs().slice();
    return Calc.txs().filter(t => t.date >= r.from && t.date <= r.to);
  },

  /** Hasil akhir setelah jenis + kategori + pencarian. */
  results(){
    const q = Tx.q.trim().toLowerCase();
    const digits = q.replace(/\D/g,"");
    return Tx.inPeriod().filter(t => {
      if(Tx.type !== "all" && t.type !== Tx.type) return false;
      if(Tx.cat !== "all" && t.category !== Tx.cat) return false;
      if(!q) return true;
      if(String(t.note).toLowerCase().includes(q)) return true;
      if(String(t.category).toLowerCase().includes(q)) return true;
      if(digits && String(Math.round(num(t.amount))).includes(digits)) return true;
      if(digits && Fmt.plain(t.amount).replace(/\./g,"").includes(digits)) return true;
      return false;
    }).sort(View._sortTx);
  },

  activeCount(){
    let n = 0;
    if(Tx.period.mode !== "month" || Tx.period.key !== currentMonthKey()) n++;
    if(Tx.cat !== "all") n++;
    return n;
  },

  /** Pastikan transaksi yang baru disimpan terlihat di daftar. */
  reveal(dateISO){
    const r = Tx.range();
    if(r && (dateISO < r.from || dateISO > r.to)){
      Tx.period = { mode:"month", key: monthKeyOf(dateISO), from:"", to:"" };
    }
  },

  /** Render ulang hanya daftar — dipakai saat mengetik di kolom pencarian. */
  renderList(){
    const el = document.getElementById("txList");
    if(el) el.innerHTML = View._txListHTML();
  }
};

View._txListHTML = function(){
  const rows = Tx.results();

  if(rows.length === 0){
    const searching = Tx.q.trim() !== "" || Tx.type !== "all" || Tx.cat !== "all";
    if(searching){
      return '<div class="empty"><b>Tidak ada yang cocok</b>'+
        '<p>Coba ubah kata kunci atau lepas filternya.</p>'+
        '<button class="btn btn--ghost btn--sm" data-action="reset-filter">Lepas semua filter</button></div>';
    }
    return '<div class="empty"><b>Belum ada transaksi</b>'+
      '<p>Catatan pertamamu akan muncul di sini.</p>'+
      '<button class="btn btn--sm" data-action="add-tx" data-type="expense">+ Catat pengeluaran</button></div>';
  }

  // Kelompokkan menurut bucket, urut dari tanggal terbaru.
  const groups = [];
  const index = {};
  rows.forEach(t => {
    const label = bucketOf(t.date).label;
    if(index[label] === undefined){ index[label] = groups.length; groups.push({label, items:[], top:t.date}); }
    const g = groups[index[label]];
    g.items.push(t);
    if(t.date > g.top) g.top = t.date;
  });
  groups.sort((a,b) => a.top < b.top ? 1 : (a.top > b.top ? -1 : 0));

  return groups.map(g => {
    const net = g.items.reduce((a,t) => a + (t.type === "expense" ? -num(t.amount) : num(t.amount)), 0);
    return '<div class="daygroup">'+
      '<div class="dayhead"><span>'+esc(g.label)+'</span>'+
        '<span class="num">'+(net>=0 ? "+" : "−")+" "+Fmt.plain(Math.abs(net))+'</span></div>'+
      '<div class="list">'+g.items.map(View._txRow).join("")+'</div></div>';
  }).join("");
};

  let html =
    '<h1 class="page-title">Transaksi</h1>'+

   ANALITIK & BUDGET (Tahap 3)
   ========================================================================== */

function monthRange(key){ return {from: key+"-01", to: key+"-"+pad2(daysInMonth(key))}; }

/** Statistik lengkap untuk satu rentang tanggal. Aman untuk rentang kosong. */
function statsFor(range){
  const list = Calc.txs().filter(t => t.date >= range.from && t.date <= range.to);
  const income  = Calc.sum(list,"income");
  const expense = Calc.sum(list,"expense");
  const adj     = Calc.sum(list,"saving");
  const saving  = income - expense;

  const acc = {};
  list.forEach(t => { if(t.type === "expense") acc[t.category] = num(acc[t.category]) + num(t.amount); });
  const byCat = Object.keys(acc)
    .map(c => ({cat:c, amount:acc[c], pct: clamp(div(acc[c], expense, 0) * 100, 0, 100)}))
    .sort((a,b) => b.amount - a.amount);

  // hari yang benar-benar sudah berjalan dalam rentang
  const from = parseISO(range.from);
  const endEff = range.to > todayISO() ? todayISO() : range.to;
  let to = parseISO(endEff);
  const days = (from && to && to >= from) ? Math.floor((to - from) / 86400000) + 1 : 0;

  // pengeluaran sampai hari ini saja — supaya rata-rata harian tidak terdistorsi
  // oleh transaksi yang sengaja dicatat bertanggal maju
  const expenseElapsed = Calc.sum(list.filter(t => t.date <= endEff), "expense");

  return {
    list, income, expense, adj, saving, byCat, days, endEff, expenseElapsed,
    rate: income > 0 ? div(saving, income, 0) * 100 : null,
    avgDaily: days > 0 ? div(expenseElapsed, days, 0) : 0,
    top: byCat[0] || null
  };
}

function budgetStatus(pct){
  if(pct === null || pct === undefined) return {key:"none", label:"Belum diatur", cls:"bstat--none", bar:"ok"};
  if(pct > 100)  return {key:"over", label:"Melebihi budget",  cls:"bstat--over", bar:"over"};
  if(pct >= 80)  return {key:"near", label:"Mendekati batas",  cls:"bstat--near", bar:"warn"};
  return {key:"ok", label:"Aman", cls:"bstat--ok", bar:"ok"};
}

/** Ringkasan budget untuk satu bulan. */
function budgetStats(key){
  const list = Calc.inMonth(key);
  const used = {};
  list.forEach(t => { if(t.type === "expense") used[t.category] = num(used[t.category]) + num(t.amount); });

  const rows = EXPENSE_CATS.map(c => {
    const budget = num(Store.data.budgets[c]);
    const spent  = num(used[c]);
    const pct    = budget > 0 ? div(spent, budget, 0) * 100 : null;
    return {cat:c, budget, spent, left: budget - spent, pct, status: budgetStatus(pct)};
  });

  const total    = rows.reduce((a,r) => a + r.budget, 0);
  const spent    = rows.reduce((a,r) => a + (r.budget > 0 ? r.spent : 0), 0);
  const spentAll = Calc.sum(list,"expense");
  const pct      = total > 0 ? div(spent, total, 0) * 100 : null;

  return {rows, total, spent, spentAll, left: total - spent, pct, status: budgetStatus(pct),
          hasBudget: total > 0, count: rows.filter(r => r.budget > 0).length};
}

/** Deret bulanan untuk grafik tren. */
function monthSeries(n){
  const out = [], cm = currentMonthKey();
  for(let i = n - 1; i >= 0; i--){
    const k = shiftMonth(cm, -i);
    const l = Calc.inMonth(k);
    out.push({key:k, income:Calc.sum(l,"income"), expense:Calc.sum(l,"expense"), adj:Calc.sum(l,"saving")});
  }
  return out;
}

/** Saldo tabungan kumulatif di akhir tiap bulan. */
function savingsSeries(n){
  const base = num(Store.data.profile.savingsBase);
  const today = todayISO();
  return monthSeries(n).map(m => {
    let end = m.key+"-"+pad2(daysInMonth(m.key));
    if(end > today) end = today;
    const bal = base + Calc.txs().reduce((a,t) =>
      t.date <= end ? a + (t.type === "expense" ? -num(t.amount) : num(t.amount)) : a, 0);
    return {key:m.key, value:bal};
  });
}

/* ---------------------------------------------------------------- CHART */
const Chart = {
  W:340, H:150, TOP:18, BOT:22,

  /** Grafik batang vertikal. series: [{label, v, hi}] */
  bars(series, o){
    o = o || {};
    const W = Chart.W, H = Chart.H, plotH = H - Chart.TOP - Chart.BOT;
    const n = Math.max(1, series.length);
    const max = Math.max(1, ...series.map(s => num(s.v)));
    const slot = W / n, bw = Math.min(40, slot * 0.56);
    const total = series.reduce((a,s) => a + num(s.v), 0);
    const avg = div(total, n, 0);

    let out = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.alt || "Grafik batang")+'">';

    if(o.showAvg && avg > 0){
      const y = Chart.TOP + plotH - div(avg, max, 0) * plotH;
      out += '<line x1="0" y1="'+y.toFixed(1)+'" x2="'+W+'" y2="'+y.toFixed(1)+'" style="stroke:var(--line-strong)" stroke-dasharray="4 4"/>';
    }

    series.forEach((s,i) => {
      const v = num(s.v);
      const h = v > 0 ? Math.max(3, div(v, max, 0) * plotH) : 0;
      const x = i * slot + (slot - bw) / 2;
      const y = Chart.TOP + plotH - h;
      const cx = (i * slot + slot / 2).toFixed(1);
      out += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
             '" rx="4" style="fill:'+(s.hi ? "var(--pine)" : "var(--pine-soft)")+'"/>';
      if(v > 0){
        out += '<text x="'+cx+'" y="'+Math.max(9, y - 5).toFixed(1)+'" text-anchor="middle" '+
               'style="fill:var(--ink-2);font-size:9px;font-weight:700">'+esc(Fmt.rpShort(v).replace("Rp",""))+'</text>';
      }
      out += '<text x="'+cx+'" y="'+(H - 6)+'" text-anchor="middle" '+
             'style="fill:var(--ink-3);font-size:10px;font-weight:600">'+esc(s.label)+'</text>';
    });
    return out + '</svg>';
  },

  /** Grafik garis + area. series: [{label, v}] */
  line(series, o){
    o = o || {};
    const W = Chart.W, H = Chart.H, plotH = H - Chart.TOP - Chart.BOT;
    const n = series.length;
    if(n === 0) return "";
    const vals = series.map(s => num(s.v));
    const max = Math.max(1, ...vals);
    const min = Math.min(0, ...vals);
    const span = (max - min) || 1;
    const px = i => n <= 1 ? W / 2 : (i / (n - 1)) * (W - 20) + 10;
    const py = v => Chart.TOP + plotH - div(num(v) - min, span, 0) * plotH;
    const pts = series.map((s,i) => px(i).toFixed(1)+","+py(s.v).toFixed(1)).join(" ");
    const baseY = Chart.TOP + plotH;

    let out = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.alt || "Grafik garis")+'">';
    out += '<polygon points="'+px(0).toFixed(1)+','+baseY+' '+pts+' '+px(n-1).toFixed(1)+','+baseY+
           '" style="fill:var(--pine-soft);opacity:.75"/>';
    out += '<polyline points="'+pts+'" fill="none" style="stroke:var(--pine);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round"/>';
    series.forEach((s,i) => {
      out += '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(s.v).toFixed(1)+'" r="'+(i === n-1 ? 3.6 : 2.2)+'" style="fill:var(--pine)"/>';
      out += '<text x="'+px(i).toFixed(1)+'" y="'+(H - 6)+'" text-anchor="middle" '+
             'style="fill:var(--ink-3);font-size:10px;font-weight:600">'+esc(s.label)+'</text>';
    });
    const last = series[n-1];
    out += '<text x="'+(W - 2)+'" y="'+Math.max(11, py(last.v) - 9).toFixed(1)+'" text-anchor="end" '+
           'style="fill:var(--ink);font-size:10.5px;font-weight:700">'+esc(Fmt.rpShort(last.v))+'</text>';
    return out + '</svg>';
  }
};

/* ---------------------------------------------------------------- INSIGHT */
const TONE = {bad:"var(--neg)", warn:"var(--gold)", ok:"var(--pos)", info:"var(--pine)"};

/**
 * Insight hanya dibuat dari data yang benar-benar ada.
 * Setiap aturan punya penjaga; kalau datanya kurang, insight tidak muncul.
 */
function insightsFor(range){
  const cur = statsFor(range);
  const out = [];
  if(cur.list.length === 0) return out;

  const mk = monthKeyOf(range.from) === monthKeyOf(range.to) ? monthKeyOf(range.from) : null;

  // Pembanding. Untuk periode satu bulan, bandingkan dengan penggal bulan lalu
  // yang sama panjangnya — kalau hari ini tanggal 6, bandingkan tanggal 1-6 bulan lalu.
  // Kalau tidak, pakai jendela sepanjang hari berjalan tepat sebelum rentang ini.
  let prev = null, prevLabel = "periode sebelumnya";
  const start = parseISO(range.from);
  if(cur.days > 0){
    if(mk){
      const pk = shiftMonth(mk, -1);
      const upto = Math.min(cur.days, daysInMonth(pk));
      const p = statsFor({from: pk+"-01", to: pk+"-"+pad2(upto)});
      if(p.list.length > 0){
        prev = p;
        prevLabel = (mk === currentMonthKey() && cur.days < daysInMonth(mk))
          ? "periode yang sama bulan lalu" : "bulan lalu";
      }
    } else if(start){
      const prevTo   = isoOf(new Date(start.getTime() - 86400000));
      const prevFrom = isoOf(new Date(start.getTime() - cur.days * 86400000));
      const p = statsFor({from:prevFrom, to:prevTo});
      if(p.list.length > 0) prev = p;
    }
  }

  // penggal berjalan dari periode ini, untuk perbandingan yang setara
  const curEff = cur.endEff === range.to ? cur : statsFor({from:range.from, to:cur.endEff});

  // 1. kategori pengeluaran terbesar
  if(cur.top && cur.expense > 0){
    out.push({tone:"info", pri:2,
      text:"Kategori "+cur.top.cat+" jadi pengeluaran terbesar: "+Fmt.rp(cur.top.amount)+" atau "+Fmt.pct(cur.top.pct)+" dari total."});
  }

  // 2. perubahan kategori terbesar dibanding pembanding
  if(cur.top && prev){
    const now  = (curEff.byCat.find(x => x.cat === cur.top.cat) || {amount:0}).amount;
    const then = (prev.byCat.find(x => x.cat === cur.top.cat)   || {amount:0}).amount;
    if(now > 0 && then > 0){
      const ch = div(now - then, then, 0) * 100;
      if(Math.abs(ch) >= 10){
        out.push({tone: ch > 0 ? "warn" : "ok", pri: ch > 0 ? 1 : 3,
          text:"Pengeluaran "+cur.top.cat+(ch > 0 ? " naik " : " turun ")+Fmt.pct(Math.abs(ch))+" dibanding "+prevLabel+"."});
      }
    }
  }

  // 3. posisi terhadap budget (budget bersifat bulanan)
  if(mk){
    const b = budgetStats(mk);
    if(b.hasBudget){
      if(b.left < 0) out.push({tone:"bad", pri:0, text:"Pengeluaran sudah lewat "+Fmt.rp(-b.left)+" dari total budget."});
      else           out.push({tone:"ok",  pri:3, text:"Pengeluaranmu masih "+Fmt.rp(b.left)+" di bawah budget."});

      const over = b.rows.filter(r => r.budget > 0 && r.spent > r.budget)
                         .sort((a,c) => (c.spent - c.budget) - (a.spent - a.budget))[0];
      if(over) out.push({tone:"bad", pri:0, text:"Budget "+over.cat+" terlampaui "+Fmt.rp(over.spent - over.budget)+"."});
    }
  }

  // 4. saving rate
  if(cur.rate !== null){
    out.push({tone: cur.rate >= 20 ? "ok" : "warn", pri: cur.rate >= 20 ? 3 : 1,
      text:"Saving rate periode ini "+Fmt.pct(cur.rate)+"."});
  }

  // 5. proyeksi akhir bulan — hanya untuk bulan berjalan dengan cukup hari
  if(mk === currentMonthKey() && cur.days >= 5 && cur.expenseElapsed > 0){
    const proj = div(cur.expenseElapsed, cur.days, 0) * daysInMonth(mk);
    out.push({tone:"info", pri:2,
      text:"Dengan ritme "+Fmt.rp(cur.avgDaily)+" per hari, pengeluaran bulan ini diperkirakan sekitar "+Fmt.rpShort(proj)+"."});
  }

  return out.sort((a,b) => a.pri - b.pri);
}

/** Ringkasan + kesimpulan satu bulan. */
function monthlyReview(key){
  const s = statsFor(monthRange(key));
  const b = budgetStats(key);

  // rata-rata harian dari maksimal 3 bulan sebelumnya yang ada datanya
  const hist = [];
  for(let i = 1; i <= 3; i++){
    const k = shiftMonth(key, -i);
    const l = Calc.inMonth(k);
    if(l.length > 0) hist.push(div(Calc.sum(l,"expense"), daysInMonth(k), 0));
  }

  let verdict;
  if(s.list.length === 0){
    verdict = "Belum ada transaksi di bulan ini.";
  } else if(hist.length > 0){
    const avg = hist.reduce((a,x) => a + x, 0) / hist.length;
    const ch = avg > 0 ? div(s.avgDaily - avg, avg, 0) * 100 : 0;
    if(avg <= 0)      verdict = "Secara umum pengeluaran bulan ini masih terkendali.";
    else if(ch > 10)  verdict = "Pengeluaran bulan ini lebih tinggi dari biasanya — rata-rata harian naik "+Fmt.pct(ch)+" dibanding "+hist.length+" bulan sebelumnya.";
    else if(ch < -10) verdict = "Pengeluaran bulan ini lebih rendah dari biasanya — rata-rata harian turun "+Fmt.pct(-ch)+".";
    else              verdict = "Secara umum pengeluaran bulan ini masih terkendali.";
  } else if(b.hasBudget){
    verdict = b.left < 0 ? "Pengeluaran bulan ini sudah melebihi budget."
                         : "Secara umum pengeluaran bulan ini masih terkendali.";
  } else {
    verdict = "Belum cukup riwayat untuk membandingkan. Catat terus supaya perbandingan antarbulan muncul bulan depan.";
  }
  return {s, b, verdict};
}

/** Periode aktif halaman Analitik. */
const An = {
  period:{mode:"this", from:"", to:""},

  range(){
    const p = An.period, cm = currentMonthKey();
    if(p.mode === "last"){ const k = shiftMonth(cm,-1); return monthRange(k); }
    if(p.mode === "3m"){   const k = shiftMonth(cm,-2); return {from:k+"-01", to:cm+"-"+pad2(daysInMonth(cm))}; }
    if(p.mode === "custom"){
      const dates = Calc.txs().map(t => t.date).sort();
      let from = p.from || dates[0] || todayISO();
      let to   = p.to   || todayISO();
      if(from > to){ const s = from; from = to; to = s; }
      return {from, to};
    }
    return monthRange(cm);
  },

  label(){
    const p = An.period;
    if(p.mode === "last") return "Bulan lalu";
    if(p.mode === "3m")   return "3 bulan terakhir";
    if(p.mode === "custom"){
      const r = An.range();
      return Fmt.date(r.from)+" – "+Fmt.date(r.to);
    }
    return "Bulan ini";
  },

  /** Bulan tunggal yang diwakili periode, atau null bila lintas bulan. */
  singleMonth(){
    const r = An.range();
    return monthKeyOf(r.from) === monthKeyOf(r.to) ? monthKeyOf(r.from) : null;
  }
};
